name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: database-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolated database regression checks
        run: npm run test:db
